<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Revision</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width: 80%;
            height: 600px;
            border: 2px solid red;
            /* overflow: auto;
            display: flex;
            /* flex-direction: column-reverse; */
            /* justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px; */ 
            display:grid;
            /* grid-template-columns: 100px repeat(2, 150px) 1fr; */
            /* 1 fr - remaining space */
            grid-template-columns: 2fr repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
        }
        .childbox{
            width: 50px;
            height: 50px;
            border: 2px solid blue;
            background-color: aqua;
            /* margin: 5px; */
        }

        .board{
            height:400px;
            width: 400px;
            border: 2px solid black;
            background-color: black;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }
        .white{
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="childbox">1</div>
        <div class="childbox">2</div>
        <div class="childbox">3</div>
        <div class="childbox">4</div>
        <div class="childbox">5</div>
    </div>


    <div class="board">
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
        <div></div>
        <div ></div>
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
        <div></div>
        <div></div>
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
    </div>

    <br><hr>
    <div>Types of positions: relative, static, absolute - can overlap, does not care but position is defined from parent element.</div>

</body>
</html>
