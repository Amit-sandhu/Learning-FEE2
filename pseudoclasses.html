<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            border: 2px solid red;
            overflow: auto;

        }
        .childbox{
            height: 40px;
            width: 40px;
            border: 2px solid black;
            background-color: aqua;
        }

        .box1{
            position: relative;
            top: 40px;
        }
        .box2{
            /* z-index: 1; - works on absolute properties */
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="childbox box1">1</div>
        <div class="childbox box2">2</div>
        <div class="childbox box3">3</div>
        <div class="childbox box4">4</div>
        <div class="childbox box5">5</div>
    </div>
</body>
</html>
