<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pge</title>
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <nav>

        <div class="logo">CodeVerse</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">About</a>
        </div>

        <div class="icons">

            <div class="bell">
                🔔
                <div class="badge">5</div>
            </div>

            <div class="profile"><img height="40px" src="https://static.thenounproject.com/png/1743561-200.png"></div>

        </div>

    </nav>


    <div class="circle1"></div>
    <div class="circle2"></div>


    <div class="login">

        <h2>Welcome Back</h2>

        <p>Login to continue</p>

        <input type="email" placeholder="Email">
        <div style="position: relative">
            <input type="password" placeholder="Password">
            <div id="eyelogo"><img height="18px" src="https://www.svgrepo.com/show/380010/eye-password-show.svg">
                <div id="warning">Password must be 8 characters long</div>
            </div>
        </div>

        <button>Login</button>

        <a href="#">Forgot Password?</a>

    </div>

    <div id="chat">
        <img height="80rem"
            src="https://static.vecteezy.com/system/resources/thumbnails/008/508/754/small_2x/3d-chat-mail-message-notification-chatting-illustration-png.png">
    </div>
</body>

</html>
