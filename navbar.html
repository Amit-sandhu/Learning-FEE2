<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        .navbar{
            width: 100%;
            height: 50px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            background-color: grey;
            flex-wrap: wrap;
            gap: 10px;
        }
        .iconnav{
            height:50px;
            width: 50px;
            color: white;
            object-fit: cover;

        }
        .name{
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-right: 25px;
        }
        .linav{
            width: 50px;
            height: 50px;
            color:white;
        }
    </style>
</head>
<body>
    <nav  class = "navbar">
            <div class = "linav"><a href="#"><img class ="iconnav" src="pattern.jpeg"></a></div>
            <div class = "name">WEBSITE</div>
            <div  class = "linav"><a href="#">Home</a></div>
            <div  class = "linav"><a href="#">About</a></div>
            <div class = "linav"><a href="#">Services</a></div>
            <div class = "linav"><a href="#">Contact</a></div>
    </nav>
</body>
</html>
