<!DOCTYPE html>

  <style>
    body {
      margin: 0px;
      background-color: black;
    }

    .login-box {
      background: cyan;
      border: 4px solid orange;
      width: 40vh;
      margin: auto;
      margin-top: 40px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .login-box input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;

    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #0083b0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #00b4db;
    }

    .navbar {
      width: 100%;
      background-color: rgb(12, 12, 12);
      height: 9vh;
      vertical-align: middle;
      align-items: center;
    }

    .main-name {
      font-size: 25px;
      vertical-align: middle;
      display: inline-block;
    }

    .nav-items {
      display: inline-block;
      margin-left: 20%;
    }

    .menu-bar {
      display: inline-block;
    }

    .box {
      width: 30%;
      border: 16px solid goldenrod;
      height: 350px;
      display: grid;
      margin: auto;
      margin-top: 80px;
      border-radius: 4%;
    }

    .row {
      background-color: antiquewhite;
      display: grid;

      grid-template-columns: repeat(8, 1fr);

    }

    .while-cols {
      background-color: white;
    }

    .black-cols {
      background-color: black;
    }
  </style>
</head>
